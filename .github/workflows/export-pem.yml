name: Export PEM Certificate

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > upload-keystore.jks
          ls -lh upload-keystore.jks

      - name: Diagnose Passwords and Export
        env:
          MY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # List of candidate passwords to test
          PASSWORDS=("$MY_PASS" "android" "123456" "password" "sobhati" "azkari")
          FOUND_PASS=""

          for p in "${PASSWORDS[@]}"; do
            if [ -n "$p" ]; then
              if keytool -list -keystore upload-keystore.jks -storepass "$p" > /dev/null 2>&1; then
                FOUND_PASS="$p"
                echo "SUCCESS: Keystore unlocked successfully!"
                break
              fi
            fi
          done

          if [ -z "$FOUND_PASS" ]; then
            echo "FAILED: None of the standard passwords unlocked this keystore file."
            exit 1
          fi

          echo "Extracting details..."
          keytool -list -v -keystore upload-keystore.jks -storepass "$FOUND_PASS"

          ALIAS_NAME=$(keytool -list -keystore upload-keystore.jks -storepass "$FOUND_PASS" | grep -E "Entry type|PrivateKeyEntry" -B 1 | head -n 1 | awk -F',' '{print $1}' | xargs)
          echo "Alias identified: $ALIAS_NAME"

          keytool -export -rfc \
            -alias "$ALIAS_NAME" \
            -file upload_certificate.pem \
            -keystore upload-keystore.jks \
            -storepass "$FOUND_PASS"

      - name: Upload PEM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-pem-certificate
          path: upload_certificate.pem
