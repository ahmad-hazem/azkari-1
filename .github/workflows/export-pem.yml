name: Generate Permanent Keystore and PEM

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Keystore
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore permanent-upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Ahmed, OU=Mobile, O=Azkari, L=Palestine, ST=Gaza, C=PS"

      - name: Export PEM Certificate
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -export -rfc \
            -alias upload \
            -file upload_certificate.pem \
            -keystore permanent-upload-keystore.jks \
            -storepass "$KEY_PASS"

      - name: Display SHA-1 Fingerprint
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "=== YOUR NEW PERMANENT SHA-1 ==="
          keytool -list -v -keystore permanent-upload-keystore.jks -storepass "$KEY_PASS" | grep "SHA1:"

      - name: Encode Keystore to Base64
        run: |
          base64 -w 0 permanent-upload-keystore.jks > keystore_base64.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: permanent-key-and-pem
          path: |
            permanent-upload-keystore.jks
            upload_certificate.pem
            keystore_base64.txt
