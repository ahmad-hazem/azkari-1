name: Export PEM Certificate

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore Password'
        required: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > upload-keystore.jks
          ls -lh upload-keystore.jks

      - name: Inspect and Export
        run: |
          echo "Listing keystore content to find alias..."
          keytool -list -v -keystore upload-keystore.jks -storepass "${{ github.event.inputs.store_password }}"

          # Extract alias name automatically
          ALIAS_NAME=$(keytool -list -keystore upload-keystore.jks -storepass "${{ github.event.inputs.store_password }}" | grep -E "Entry type|PrivateKeyEntry" -B 1 | head -n 1 | awk -F',' '{print $1}')
          echo "Found Alias: $ALIAS_NAME"

          # Export PEM using the auto-detected alias
          keytool -export -rfc \
            -alias "$ALIAS_NAME" \
            -file upload_certificate.pem \
            -keystore upload-keystore.jks \
            -storepass "${{ github.event.inputs.store_password }}"

      - name: Upload PEM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-pem-certificate
          path: upload_certificate.pem
