name: Export PEM Certificate

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > upload-keystore.jks

      - name: Inspect and Export
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "Listing keystore entries using secure environment variable..."
          keytool -list -v -keystore upload-keystore.jks -storepass "$STORE_PASS"

          # Extract alias name automatically
          ALIAS_NAME=$(keytool -list -keystore upload-keystore.jks -storepass "$STORE_PASS" | grep -E "Entry type|PrivateKeyEntry" -B 1 | head -n 1 | awk -F',' '{print $1}' | xargs)
          echo "Found Alias: $ALIAS_NAME"

          # Export PEM certificate
          keytool -export -rfc \
            -alias "$ALIAS_NAME" \
            -file upload_certificate.pem \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASS"

      - name: Upload PEM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-pem-certificate
          path: upload_certificate.pem
