name: Build Signed Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Create Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass "AzKari2026@Upload" \
            -keypass "AzKari2026@Upload" \
            -dname "CN=AzKari, OU=Mobile, O=AzKari, L=Gaza, ST=Gaza, C=PS"

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Verify AAB Signature
        run: |
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-backup
          path: android/app/upload-keystore.jks
